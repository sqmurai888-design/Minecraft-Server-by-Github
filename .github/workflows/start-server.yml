name: "🟢 Start Minecraft Server"

on:
  workflow_dispatch:
    inputs:
      minecraft_version:
        description: "Minecraftのバージョン (latest = 最新版)"
        required: false
        default: "latest"
      server_type:
        description: "サーバーの種類 (MODを使う場合は fabric か forge)"
        type: choice
        options:
          - vanilla
          - fabric
          - forge
        default: vanilla
      idle_timeout:
        description: "無人時の自動停止までの分数 (0 = 自動停止しない)"
        required: false
        default: "30"
      backup_interval:
        description: "自動バックアップの間隔 (分, 0 = 定期バックアップ無効)"
        required: false
        default: "20"
      auto_restart:
        description: "6時間制限に達したとき自動で再起動する"
        type: boolean
        required: false
        default: true

# 二重起動を防止 (同時に動くサーバーは常に1つ)
concurrency:
  group: minecraft-server
  cancel-in-progress: false

jobs:
  server:
    name: Minecraft Server
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: write
      actions: write
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v5

      - name: バージョンと必要な Java を解決
        id: resolve
        run: bash scripts/resolve-version.sh
        env:
          MC_VERSION: ${{ inputs.minecraft_version }}

      - name: Java ${{ steps.resolve.outputs.java_version }} をセットアップ
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ steps.resolve.outputs.java_version }}

      - name: サーバーを起動
        run: bash scripts/server.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MC_VERSION: ${{ steps.resolve.outputs.mc_version }}
          SERVER_TYPE: ${{ inputs.server_type }}
          SERVER_JAR_URL: ${{ steps.resolve.outputs.server_jar_url }}
          IDLE_TIMEOUT_MIN: ${{ inputs.idle_timeout }}
          BACKUP_INTERVAL_MIN: ${{ inputs.backup_interval }}
          AUTO_RESTART: ${{ inputs.auto_restart }}
