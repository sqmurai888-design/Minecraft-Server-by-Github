name: "🟢 Start Minecraft Server"

on:
  workflow_dispatch:
    inputs:
      minecraft_version:
        description: "Minecraftのバージョン (latest = 最新版)"
        required: false
        default: "latest"
      idle_timeout:
        description: "無人時の自動停止までの分数 (0 = 自動停止しない)"
        required: false
        default: "30"
      auto_restart:
        description: "6時間制限に達したとき自動で再起動する"
        type: boolean
        required: false
        default: true

# 二重起動を防止 (同時に動くサーバーは常に1つ)
concurrency:
  group: minecraft-server
  cancel-in-progress: false

jobs:
  server:
    name: Minecraft Server
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: write
      actions: write
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Java 21 をセットアップ
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: サーバーを起動
        run: bash scripts/server.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MC_VERSION: ${{ inputs.minecraft_version }}
          IDLE_TIMEOUT_MIN: ${{ inputs.idle_timeout }}
          AUTO_RESTART: ${{ inputs.auto_restart }}
