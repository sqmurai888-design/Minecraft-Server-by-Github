name: "🔴 Stop Minecraft Server"

on:
  workflow_dispatch:

jobs:
  stop:
    name: Stop Signal
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v5

      - name: 停止シグナルを送信
        run: |
          # stop-signal ブランチを作成すると、起動中のサーバーが検知して
          # ワールドを保存してから安全にシャットダウンする (最大1〜2分)
          git push origin "HEAD:refs/heads/stop-signal" -f
          echo "🔴 停止シグナルを送信しました。サーバーは1〜2分以内に保存して停止します。" >> "$GITHUB_STEP_SUMMARY"
