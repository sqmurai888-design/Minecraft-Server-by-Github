# Minecraft サーバー設定
# このファイルを編集してコミットすると、次回起動時に反映されます。
# 設定項目の一覧: https://minecraft.wiki/w/Server.properties

# サーバー名 (サーバー一覧に表示される)
motd=§a§lGitHub Actions §f× §b§lMinecraft Server

# ゲームモード: survival / creative / adventure / spectator
gamemode=survival

# 難易度: peaceful / easy / normal / hard
difficulty=normal

# 最大プレイヤー数
max-players=10

# 正規アカウントのみ許可 (true 推奨)
online-mode=true

# PvP の有効/無効
pvp=true

# 描画距離 (大きいほど重くなる)
view-distance=10
simulation-distance=10

# ホワイトリスト (true にした場合は whitelist.json の管理が必要)
white-list=false

# シード値 (空欄 = ランダム)
level-seed=

# ※ 変更しないこと (トンネルがこのポートを使用)
server-port=25565
enable-rcon=false
